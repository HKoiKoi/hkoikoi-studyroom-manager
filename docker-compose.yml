services:
  # ----------------------------------------
  # MySQL
  # ----------------------------------------
  mysql:
    image: mysql:9.7.0
    container_name: studyroom-manager-mysql
    restart: always
    env_file: .env
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_FLYWAY_USER: ${MYSQL_FLYWAY_USER}
      MYSQL_FLYWAY_PASSWORD: ${MYSQL_FLYWAY_PASSWORD}
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - studyroom-manager-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------
  # Backend
  # ----------------------------------------
  backend:
    build: ./backend
    container_name: studyroom-manager-backend
    restart: always
    ports:
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_FLYWAY_USER=${MYSQL_FLYWAY_USER}
      - MYSQL_FLYWAY_PASSWORD=${MYSQL_FLYWAY_PASSWORD}
      - MYSQL_APP_USER=${MYSQL_APP_USER}
      - MYSQL_APP_PASSWORD=${MYSQL_APP_PASSWORD}
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - studyroom-manager-network

  # ----------------------------------------
  # Frontend
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: studyroom-manager-frontend
    restart: always
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - studyroom-manager-network

volumes:
  mysql-data:

networks:
  studyroom-manager-network:
    driver: bridge

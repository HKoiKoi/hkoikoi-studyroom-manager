spring:
  # ----------------------------------------
  # JPA / Hibernate
  # ----------------------------------------
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# ----------------------------------------
# Cors
# ----------------------------------------
app:
  cors:
    allowed-origins: "http://localhost:3010"

# ----------------------------------------
# Logging
# ----------------------------------------
logging:
  level:
    root: info
    com.hkoikoi.studyroomManager: debug
    org.flywaydb: info
